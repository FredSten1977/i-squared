<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1119" />
    <title>Kontroll • I-Squared Statsbygg</title>
    <style>
      /* Felles designtokens – videreført fra prototypen */
:root {
  --north: #55c8ff;
  --north-deep: #0b5b80;
  --south: #ff654f;
  --south-deep: #7c251c;
  --gold: #ffd166;
  --green: #57d68d;
  --bg: #07111c;
  --bg-2: #0b1119;
  --panel: rgba(7, 18, 31, 0.9);
  --panel-solid: #131d29;
  --line: #26374b;
  --text: #f7fbff;
  --muted: #a9bacb;
  --focus: #ffd166;
  --radius: 16px;
  --font: 'Helvetica Neue', Arial, Helvetica, sans-serif;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.north {
  color: var(--north);
}
.south {
  color: var(--south);
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

      /* Mobil kontrollflate – mobil først, store trykkflater, én hånd */
body {
  min-height: 100vh;
  background: var(--bg-2);
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button,
input,
select,
textarea {
  font: inherit;
}
.top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(11, 17, 25, 0.97);
  border-bottom: 1px solid var(--line);
  padding: max(10px, env(safe-area-inset-top)) 12px 10px;
}
.topRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.topTitle {
  font-weight: 950;
  font-size: 16px;
}
.conn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--green);
  display: inline-block;
}
.dot.off {
  background: var(--south);
}
.dot.warn {
  background: var(--gold);
}
.chips {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 8px;
}
.chip {
  background: #0d1621;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 6px 8px;
  min-width: 0;
}
.chip .k {
  display: block;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.chip .v {
  display: block;
  font-weight: 900;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chip .v.timerV {
  font-variant-numeric: tabular-nums;
  font-size: 18px;
}
.chip.warn .v {
  color: var(--gold);
}
.chip.danger .v {
  color: var(--south);
}
main {
  padding: 12px;
  max-width: 720px;
  margin: 0 auto;
}
.tab {
  display: none;
}
.tab.active {
  display: block;
}
h2 {
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 20px 4px 8px;
}
h2:first-child {
  margin-top: 4px;
}
.card {
  background: var(--panel-solid);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.grid3 {
  grid-template-columns: repeat(3, 1fr);
}
.grid1 {
  grid-template-columns: 1fr;
}
.span2 {
  grid-column: span 2;
}
.btn {
  min-height: 56px;
  border: 1px solid #395069;
  border-radius: 12px;
  background: #203044;
  color: #fff;
  padding: 10px 12px;
  font-weight: 800;
  font-size: 15px;
  line-height: 1.2;
  cursor: pointer;
  width: 100%;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  text-align: center;
}
.btn:active {
  filter: brightness(1.25);
}
.btn[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn.busy {
  position: relative;
  cursor: progress;
  outline: 3px solid var(--gold);
  outline-offset: -3px;
}
.btn.busy::after {
  content: '';
  position: absolute;
  right: 10px;
  top: 50%;
  width: 16px;
  height: 16px;
  margin-top: -8px;
  border-radius: 50%;
  border: 3px solid #ffffff55;
  border-top-color: #fff;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.btn.blue {
  background: var(--north-deep);
  border-color: var(--north);
}
.btn.red {
  background: var(--south-deep);
  border-color: var(--south);
}
.btn.gold {
  background: #725c10;
  border-color: var(--gold);
}
.btn.green {
  background: #17633c;
  border-color: var(--green);
}
.btn.danger {
  background: #4a1414;
  border-color: #ff4d4d;
}
.btn.ghost {
  background: transparent;
}
.btn.on {
  outline: 3px solid var(--gold);
  outline-offset: -3px;
}
.btn.big {
  min-height: 72px;
  font-size: 18px;
}
.btn small {
  display: block;
  font-weight: 600;
  font-size: 12px;
  color: #d3dde6;
  margin-top: 3px;
}
.next {
  border-color: var(--gold);
  background: linear-gradient(160deg, #1d2533, #131d29);
}
.next .now {
  font-size: 13px;
  color: var(--muted);
}
.next .now b {
  color: #fff;
}
.seg {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.seg .btn {
  min-height: 48px;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 13px;
}
.pill {
  display: inline-block;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.08em;
  padding: 3px 8px;
  border-radius: 999px;
  background: #26374b;
}
.pill.open {
  background: #17633c;
}
.pill.closed {
  background: #4a2a36;
}
.pill.pending {
  background: #725c10;
}
.pill.approved {
  background: #0b5b80;
}
.bigTimer {
  font-size: 72px;
  font-weight: 950;
  text-align: center;
  font-variant-numeric: tabular-nums;
  margin: 4px 0 10px;
  letter-spacing: -0.04em;
}
.bigTimer.warn {
  color: var(--gold);
}
.bigTimer.danger,
.bigTimer.done {
  color: var(--south);
}
label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin: 10px 0 4px;
}
input,
select,
textarea {
  width: 100%;
  min-height: 48px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #0d1621;
  color: #fff;
  font-size: 16px;
}
textarea {
  min-height: 90px;
  resize: vertical;
}
.check {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  color: var(--text);
  font-size: 15px;
  margin: 0;
}
.check input {
  width: 24px;
  min-height: 24px;
  height: 24px;
}
.pollRow {
  display: grid;
  gap: 8px;
}
.pollHead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.pollHead b {
  font-size: 15px;
}
.num {
  font-variant-numeric: tabular-nums;
  font-weight: 900;
}
.bars {
  display: grid;
  gap: 4px;
  font-size: 13px;
}
.bars div {
  display: grid;
  grid-template-columns: 84px 1fr 40px;
  gap: 8px;
  align-items: center;
}
.bars i {
  display: block;
  height: 10px;
  border-radius: 5px;
  background: #57d68d;
}
.bars .against i {
  background: #e05d6f;
}
.bars .neutral i {
  background: #9aa9b8;
}
.warnBox {
  border: 1px solid var(--gold);
  background: #2b2410;
  border-radius: 12px;
  padding: 12px;
  margin: 10px 0;
  line-height: 1.4;
}
.okBox {
  border: 1px solid var(--green);
  background: #10281b;
  border-radius: 12px;
  padding: 10px 12px;
  margin: 10px 0;
}
.score {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  text-align: center;
}
.score .n {
  font-size: 44px;
  font-weight: 950;
  font-variant-numeric: tabular-nums;
}
.cardBtn {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
}
.cardBtn .ic {
  font-size: 28px;
}
.cardBtn.used {
  opacity: 0.55;
  text-decoration: line-through;
}
.qrs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.qrItem {
  background: #fff;
  color: #000;
  border-radius: 12px;
  padding: 8px;
  text-align: center;
  font-size: 12px;
  font-weight: 800;
}
.qrItem svg {
  width: 100%;
  height: auto;
  display: block;
}
.qrItem a {
  color: #0b5b80;
  word-break: break-all;
  font-weight: 600;
}
.log {
  font-size: 12px;
  line-height: 1.5;
  max-height: 260px;
  overflow: auto;
  font-family: ui-monospace, Menlo, monospace;
  color: #c9d5df;
}
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: rgba(11, 17, 25, 0.98);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  background: none;
  border: 0;
  color: var(--muted);
  min-height: 62px;
  font-size: 9.5px;
  font-weight: 900;
  letter-spacing: 0.02em;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 4px 0;
  cursor: pointer;
}
.tabbar button .i {
  font-size: 20px;
}
.tabbar button[aria-selected='true'] {
  color: #fff;
  background: #16222f;
  box-shadow: inset 0 3px 0 var(--gold);
}
.toast {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(76px + env(safe-area-inset-bottom));
  z-index: 30;
  background: #3b1111;
  border: 1px solid #ff654f;
  color: #ffe1db;
  padding: 12px 14px;
  border-radius: 12px;
  font-weight: 700;
  display: none;
  max-width: 696px;
  margin: 0 auto;
}
.toast.ok {
  background: #10281b;
  border-color: var(--green);
  color: #dfffea;
}
.toast.show {
  display: block;
}
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #000b;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 12px;
}
.modal.show {
  display: flex;
}
.modal .box {
  width: 100%;
  max-width: 520px;
  background: var(--panel-solid);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: env(safe-area-inset-bottom);
}
.modal h3 {
  margin: 0 0 8px;
  font-size: 20px;
}
.modal p {
  color: #d2dce5;
  line-height: 1.45;
  margin: 0 0 12px;
}
#login {
  max-width: 420px;
  margin: 12vh auto 0;
  padding: 20px;
}
#login h1 {
  font-size: 26px;
  margin: 0 0 6px;
}
@media (min-width: 700px) {
  .grid.wide3 {
    grid-template-columns: repeat(3, 1fr);
  }
}

.nextLabel {
  margin: 8px 0 10px;
  font-size: 15px;
  line-height: 1.35;
}
.nextLabel b {
  font-size: 17px;
}
#nextBtn {
  min-height: 84px;
  font-size: 24px;
  letter-spacing: 0.06em;
}
.cueList summary {
  cursor: pointer;
  font-weight: 800;
  min-height: 32px;
}
.cueList ol {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: grid;
  gap: 4px;
}
.cue {
  width: 100%;
  text-align: left;
  display: flex;
  gap: 10px;
  align-items: center;
  min-height: 44px;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #0d1621;
  color: #fff;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.cue .st {
  flex: 0 0 28px;
  font-weight: 900;
  color: var(--gold);
  text-align: right;
}
.cue.done {
  opacity: 0.5;
}
.cue.current {
  border-color: var(--gold);
  background: #2b2410;
}
.bigTimer.over {
  color: var(--south);
}

    </style>

<script>window.ISQ_BOOT = Object.assign({}, window.ISQ_CONFIG || {}, { page: "admin", poll: (function () { try { var p = new URLSearchParams(location.search).get('poll'); return p && /^[a-z0-9-]{1,20}$/.test(p) ? p : null; } catch (e) { return null; } })() });</script>
  </head>
  <body>
    <section id="login" hidden>
      <h1>Kontrollflate</h1>
      <p class="muted" id="loginTitle">I-Squared Statsbygg</p>
      <form id="loginForm" class="card" autocomplete="off">
        <label for="pin">Administrator-PIN</label>
        <input id="pin" name="pin" type="password" autocomplete="current-password" required minlength="1" />
        <div style="height: 12px"></div>
        <button class="btn big blue" type="submit" id="loginBtn">Logg inn</button>
        <p id="loginErr" class="small" role="alert" style="color: #ffb4a6"></p>
      </form>
    </section>

    <div id="app" hidden>
      <header class="top">
        <div class="topRow">
          <div class="topTitle" id="appTitle">I-Squared • Kontroll</div>
          <div class="conn" role="status" aria-live="polite">
            <span class="dot" id="connDot" aria-hidden="true"></span><span id="connText">Tilkoblet</span>
          </div>
        </div>
        <div class="chips">
          <div class="chip"><span class="k">Skjerm</span><span class="v" id="chipView">–</span></div>
          <div class="chip"><span class="k">Påstand</span><span class="v" id="chipStatement">–</span></div>
          <div class="chip" id="chipTimerBox"><span class="k" id="chipTimerK">Timer</span><span class="v timerV" id="chipTimer">–</span></div>
          <div class="chip"><span class="k">Avstemning</span><span class="v" id="chipPoll">–</span></div>
          <div class="chip"><span class="k">Stemmer</span><span class="v num" id="chipVotes">0</span></div>
          <div class="chip"><span class="k">Nord – Sør</span><span class="v num" id="chipScore">0 – 0</span></div>
        </div>
      </header>

      <main>
        <section class="tab active" id="tab-run" role="tabpanel" aria-labelledby="t-run"></section>
        <section class="tab" id="tab-poll" role="tabpanel" aria-labelledby="t-poll"></section>
        <section class="tab" id="tab-timer" role="tabpanel" aria-labelledby="t-timer"></section>
        <section class="tab" id="tab-cards" role="tabpanel" aria-labelledby="t-cards"></section>
        <section class="tab" id="tab-results" role="tabpanel" aria-labelledby="t-results"></section>
        <section class="tab" id="tab-media" role="tabpanel" aria-labelledby="t-media"></section>
        <section class="tab" id="tab-admin" role="tabpanel" aria-labelledby="t-admin"></section>
      </main>

      <nav class="tabbar" role="tablist" aria-label="Seksjoner">
        <button id="t-run" role="tab" data-tab="run" aria-selected="true" aria-label="Kjøreplan" title="Kjøreplan"><span class="i" aria-hidden="true">▶︎</span>PLAN</button>
        <button id="t-poll" role="tab" data-tab="poll" aria-selected="false" aria-label="Avstemning" title="Avstemning"><span class="i" aria-hidden="true">🗳</span>AVSTEM</button>
        <button id="t-timer" role="tab" data-tab="timer" aria-selected="false" aria-label="Timer" title="Timer"><span class="i" aria-hidden="true">⏱</span>TIMER</button>
        <button id="t-cards" role="tab" data-tab="cards" aria-selected="false" aria-label="Spillekort" title="Spillekort"><span class="i" aria-hidden="true">🟨</span>KORT</button>
        <button id="t-results" role="tab" data-tab="results" aria-selected="false" aria-label="Resultater" title="Resultater"><span class="i" aria-hidden="true">🏆</span>RESULTAT</button>
        <button id="t-media" role="tab" data-tab="media" aria-selected="false" aria-label="Media" title="Media"><span class="i" aria-hidden="true">🎬</span>MEDIA</button>
        <button id="t-admin" role="tab" data-tab="admin" aria-selected="false" aria-label="Admin" title="Admin"><span class="i" aria-hidden="true">⚙︎</span>ADMIN</button>
      </nav>

      <div id="toast" class="toast" role="alert"></div>

      <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="box">
          <h3 id="modalTitle">Bekreft</h3>
          <p id="modalText"></p>
          <div id="modalExtra"></div>
          <div class="grid" style="margin-top: 12px">
            <button class="btn ghost" type="button" id="modalCancel">Avbryt</button>
            <button class="btn danger" type="button" id="modalOk">Bekreft</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // @ts-check
/**
 * Seed-data og faste definisjoner for I-Squared Statsbygg.
 * Kjører i Apps Script (global), i nettleseren (global) og i Node (module.exports).
 */
var ISQ_Config = (function () {
  'use strict';

  var CHOICES = ['against', 'neutral', 'for'];
  var CHOICE_LABELS = { against: 'MOT', neutral: 'NØYTRAL', for: 'FOR' };
  /** Skala for netto flyttede stemmesteg. */
  var CHOICE_VALUE = { against: 0, neutral: 1, for: 2 };

  var TEAMS = ['north', 'south'];

  var CARDS = [
    { key: 'yellow', icon: '🟨', title: 'PASS', name: 'Gult kort', text: 'Laget slipper å svare.' },
    { key: 'red', icon: '🟥', title: 'INNSIGELSE', name: 'Rødt kort', text: 'Laget avbryter med en kort innsigelse.' },
    { key: 'green', icon: '🟩', title: 'EKSTRATID', name: 'Grønt kort', text: 'Laget får ett ekstra minutt.' },
    { key: 'english', icon: '🇬🇧', title: 'ENGLISH, PLEASE', name: 'Britisk flagg', text: 'Svaret må gis på engelsk.' },
    { key: 'yesno', icon: '❗', title: 'JA ELLER NEI', name: 'Utropstegn', text: 'Motstanderlaget må først svare ja eller nei.' }
  ];

  var VIEWS = [
    'hero',
    'mainQuestion',
    'statement',
    'qr',
    'team',
    'opening',
    'cross',
    'closing',
    'result',
    'leaderboard',
    'mainResult',
    'winner',
    'rules',
    'video',
    'black'
  ];

  var VIEW_LABELS = {
    hero: 'Hero',
    mainQuestion: 'Hovedspørsmål',
    statement: 'Påstand',
    qr: 'QR-kode / avstemning',
    team: 'Lagpresentasjon',
    opening: 'Åpningsinnlegg',
    cross: 'Kryssforhør',
    closing: 'Sluttappell',
    result: 'Avstemningsresultat',
    leaderboard: 'Leaderboard',
    mainResult: 'Resultat hovedspørsmål',
    winner: 'Vinner av debatten',
    rules: 'Debattregler',
    video: 'Video',
    black: 'Svart skjerm'
  };

  /**
   * Videoer spilles fra den lokale publikumsskjerm-mappen på Mac-en.
   * returnTo: hvor skjermen går når videoen er ferdig (null = visningen før videoen).
   */
  var VIDEOS = [
    // Debattintroen har sangen innbakt (ingen egen soundtrack), og går tilbake til debattreglene
    { key: 'introDebate', label: 'Debattintro', file: 'media/video/introdebatt.mp4', returnTo: { view: 'rules' } },
    { key: 'introNorth', label: 'Introvideo Lag Nord', file: 'media/video/Introvideonord.mp4', team: 'north', returnTo: null },
    { key: 'introSouth', label: 'Introvideo Lag Sør', file: 'media/video/Introvideosør.mp4', team: 'south', returnTo: { view: 'statement', statementNo: 1 } },
    {
      key: 'extra1',
      label: 'Ekstravideo påstand 1',
      file: 'media/video/ekstravideopåstand1.mp4',
      statement: 1,
      returnTo: { view: 'statement', statementNo: 1 }
    },

        if (e.code === 'AUTH') {
          cl.storage.remove('isq-session');
          showLogin(e.message);
        } else {
          toast(e.message || 'Handlingen feilet.');
        }
        return null;
      })
      .then(function (d) {
        busy = false;
        if (el) el.classList.remove('busy');
        return d;
      });

  // Bekreftelsesdialog
  /** @type {any} */
  var modalResolve = null;
  /** @param {{title?:string, text:string, typed?:string, extra?:string, ok?:string}} o @returns {Promise<boolean>} */
  function confirmDialog(o) {
    $('modalTitle').textContent = o.title || 'Bekreft';
    $('modalText').textContent = o.text;
    var extra = o.extra || '';
    if (o.typed)
      extra +=
        '<label for="typedInput">Skriv <b>' +
        esc(o.typed) +
        '</b> for å bekrefte</label><input id="typedInput" autocomplete="off" autocapitalize="characters" />';
    $('modalExtra').innerHTML = extra;
    $('modalOk').textContent = o.ok || 'Bekreft';
    $('modal').classList.add('show');
    setTimeout(function () {
      var f = /** @type {HTMLElement|null} */ ($('modalExtra').querySelector('input,textarea'));
      (f || $('modalCancel')).focus();
    }, 50);
    return new Promise(function (resolve) {
      modalResolve = function (/** @type {boolean} */ ok) {
        if (ok && o.typed) {
          var v = String($('typedInput').value || '')
            .trim()
            .toUpperCase();
          if (v !== o.typed.toUpperCase()) {
            toast('Skriv ' + o.typed + ' for å bekrefte.');
            return;
          }
        }
        $('modal').classList.remove('show');
        modalResolve = null;
        resolve(ok);
      };
    });
  }
  $('modalOk').addEventListener('click', function () {
    if (modalResolve) modalResolve(true);
  });
  $('modalCancel').addEventListener('click', function () {
    if (modalResolve) modalResolve(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalResolve) modalResolve(false);
  });

  document.addEventListener('click', function (e) {
    var el = /** @type {HTMLElement|null} */ (/** @type {HTMLElement} */ (e.target).closest('[data-act]'));
    if (!el || /** @type {any} */ (el).disabled) return;
    if (el.tagName === 'A') e.preventDefault();
    var action = /** @type {string} */ (el.getAttribute('data-act'));
    var params = {};
    try {
      params = JSON.parse(el.getAttribute('data-p') || '{}');
    } catch (err) {
      /* ignorert */
    }
    if (action.indexOf('ui:') === 0) return uiAction(action.slice(3), params, el);
    var msg = el.getAttribute('data-confirm');
    if (msg) {
      confirmDialog({ title: el.getAttribute('data-title') || 'Bekreft', text: msg, typed: el.getAttribute('data-typed') || undefined }).then(function (ok) {
        if (ok) act(action, Object.assign({}, params, { confirm: true }), el);
      });
      return;
    }
    act(action, params, el);
  });

  /** Handlinger som krever skjema/inndata. @param {string} name @param {any} p @param {HTMLElement} el */
  function uiAction(name, p, el) {
    if (name === 'override') {
      var r = (state.results || {})[String(p.statementNo)] || {};
      confirmDialog({
        title: 'Overstyr resultat – påstand ' + p.statementNo,
        text: 'Sett flyttede stemmer manuelt. Resultatet merkes som manuelt fastsatt.',
        extra:
          '<div class="grid"><div><label for="ovN">' +
          esc(teamName('north')) +
          '</label><input id="ovN" type="number" inputmode="numeric" min="0" value="' +
          (r.north || 0) +
          '" /></div>' +
          '<div><label for="ovS">' +
          esc(teamName('south')) +
          '</label><input id="ovS" type="number" inputmode="numeric" min="0" value="' +
          (r.south || 0) +
          '" /></div></div>' +
          '<label for="ovR">Begrunnelse (vises i logg og rapport)</label><textarea id="ovR"></textarea>',
        ok: 'Overstyr'
      }).then(function (ok) {
        if (!ok) return;
        act(
          'overrideResult',
          {
            statementNo: p.statementNo,
            north: Number($('ovN').value || 0),
            south: Number($('ovS').value || 0),
            reason: String($('ovR').value || '').trim(),
            confirm: true
          },
          el
        );
      });
    } else if (name === 'customTime' || name === 'customStart') {
      var m = Number($('tMin').value || 0);
      var s = Number($('tSec').value || 0);
      var secs = Math.max(0, Math.round(m * 60 + s));
      act(name === 'customStart' ? 'timerStart' : 'timerSet', { seconds: secs }, el);
    } else if (name === 'saveEvent') {
      var slug = String($('aSlug').value || '').trim();
      var params = {
        title: $('aTitle').value,
        heroTitle: $('aHero').value,
        kicker: $('aKicker').value,
        mainQuestion: $('aMain').value,
        labelAgainst: $('aLA').value,
        labelNeutral: $('aLN').value,
        labelFor: $('aLF').value,
        slug: slug
      };
      var go = function (/** @type {boolean} */ confirmed) {
        if (confirmed) /** @type {any} */ (params).confirm = true;
        act('updateEvent', params, el).then(function (d) {
          if (d) {
            adminRendered = false;
            render();
            toast('Lagret', true);
          }
        });
      };
      if (slug && slug !== state.eventConfig.slug) {
        confirmDialog({ title: 'Bytt arrangement-ID', text: 'Lenker og QR-koder med ?event=' + state.eventConfig.slug + ' slutter å virke. Fortsette?' }).then(
          function (ok) {
            if (ok) go(true);
          }
        );
      } else go(false);
    } else if (name === 'saveStatement') {
      var n = p.statementNo;
      act(
        'updateStatement',
        {
          statementNo: n,
          text: $('sT' + n).value,
          short: $('sS' + n).value,
          northPosition: $('sN' + n).value,
          southPosition: $('sP' + n).value
        },
        el
      ).then(function (d) {
        if (d) toast('Påstand ' + n + ' lagret', true);
      });
    } else if (name === 'saveSettings') {
      act(
        'updateSettings',
        {
          soundEnabled: $('setSound').checked,
          autoStartTimer: $('setAuto').checked,
          requireEqualTurnout: $('setEqual').checked,
          opening: Number($('dOpen').value),
          cross: Number($('dCross').value),
          closing: Number($('dClose').value),
          team: Number($('dTeam').value)
        },
        el
      ).then(function (d) {
        if (d) toast('Innstillinger lagret', true);
      });
    } else if (name === 'demo') {
      act('generateDemoVotes', { pollId: $('demoPoll').value, count: $('demoCount').value ? Number($('demoCount').value) : undefined }, el).then(function (d) {
        if (d && d.result) toast(d.result.count + ' demostemmer lagt til', true);
      });
    } else if (name === 'reloadAdmin') {
      adminRendered = false;
      /** @type {any} */ ($('tab-admin')).__html = '';
      render();
    } else if (name === 'logout') {
      cl.call('auth.logout', { session: session }).catch(function () {});
      cl.storage.remove('isq-session');
      session = null;
      showLogin('Du er logget ut.');
    } else if (name === 'copy') {
      var url = String(p.url || '');
      if (navigator.clipboard)
        navigator.clipboard.writeText(url).then(
          function () {
            toast('Lenke kopiert', true);
          },
          function () {
            toast(url);
          }
        );
      else toast(url);
    } else if (name === 'tab') {
      selectTab(p.tab);
    }
  }

  );
  ['pointerup', 'pointercancel'].forEach(function (ev) {

      },

  /** @param {string} id @param {string} html @returns {boolean} om innholdet ble byttet */
  function setHtml(id, html) {
    var el = /** @type {any} */ ($(id));
    if (el.__html === html) return false;
    if (pointerActive) {
      pendingRender = true;
      return false;
    }
    el.innerHTML = html;
    el.__html = html;
    return true;
  }

  function renderTimer() {

    h +=
      btn('Nullstill', 'timerReset', {}, { cls: 'big' }) +
      btn('−10 sek', 'timerAdjust', { delta: -10 }) +

      '</div></div>';
    h +=
      '<h2>Valgfri tid</h2><div class="card"><div class="grid"><div><label for="tMin">Minutter</label><input id="tMin" type="number" inputmode="numeric" min="0" value="' +
      (Number(cl.storage.get('isq-tmin')) || 2) +
      '"></div><div><label for="tSec">Sekunder</label><input id="tSec" type="number" inputmode="numeric" min="0" max="59" value="' +
      (Number(cl.storage.get('isq-tsec')) || 0) +

      btn('Kryssforhør Nord', 'startSegment', { kind: 'cross', team: 'north' }, { cls: 'blue', sub: T.format(d.cross) }) +

      btn('Sluttappell Sør', 'startSegment', { kind: 'closing', team: 'south' }, { cls: 'red', sub: T.format(d.closing) }) +

  // ---------- Timer-visning ----------
  function tickTimers() {
    if (!state) return;
    var sec = T.remainingMs(state.timer, cl.serverNow()) / 1000;
    var signedSec = T.signedRemainingMs(state.timer, cl.serverNow()) / 1000;
    var ph = T.phase(sec);
    var seg = state.segment;
    var cfg = seg && C.SEGMENTS[seg.kind];
    var over = !!(cfg && cfg.overtime && state.timer.status === 'running' && signedSec <= -1);
    var text = over ? T.formatSigned(signedSec) : ph === 'done' ? 'TID' : T.format(sec);
    $('chipTimer').textContent = text;
    $('chipTimerK').textContent = state.timer.status === 'running' ? 'Timer • går' : state.timer.status === 'paused' ? 'Timer • pause' : 'Timer';
    var box = $('chipTimerBox');
    box.classList.toggle('warn', ph === 'warn');
    box.classList.toggle('danger', ph === 'danger' || ph === 'done' || over);
    var big = $('bigTimer');
    if (big) {
      big.textContent = text;
      big.className = 'bigTimer ' + (over ? 'over' : ph);
      $('timerStatus').textContent = state.timer.status === 'running' ? 'går' : state.timer.status === 'paused' ? 'pause' : 'klar';
    }
  }
  setInterval(tickTimers, 200);
  setInterval(function () {
    if (state && currentTab === 'media') renderMedia();
  }, 5000);

  // ---------- Oppstart ----------
  if (session) start();
  else showLogin();
})();
